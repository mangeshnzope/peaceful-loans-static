<script>
// Generate a unique 4-digit number for username
function generateRandomNumber() {
  return Math.floor(1000 + Math.random() * 9000);
}

// Generate default username
let currentUsername = sessionStorage.getItem('anon_username');
if (!currentUsername || (currentUsername.startsWith('c/Peaceful-Loans-') && !currentUsername.startsWith('c/Peaceful-Loans-Home-Loans-'))) {
  currentUsername = `c/Peaceful-Loans-Home-Loans-${generateRandomNumber()}`;
  sessionStorage.setItem('anon_username', currentUsername);
}

// Capture and store UTM parameters & li_fat_id in sessionStorage
function captureUtmParams() {
  const urlParams = new URLSearchParams(window.location.search);
  const keys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'li_fat_id'];
  keys.forEach(key => {
    const val = urlParams.get(key);
    if (val) {
      sessionStorage.setItem(key, val);
    }
  });
}
captureUtmParams();

// Capture and store initial landing page URL in sessionStorage
function captureReferrer() {
  if (!sessionStorage.getItem('initial_referrer')) {
    sessionStorage.setItem('initial_referrer', window.location.href);
  }
}
captureReferrer();

function getUtmParams() {
  const utms = {};
  const utmKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
  utmKeys.forEach(key => {
    const stored = sessionStorage.getItem(key);
    if (stored) {
      utms[key] = stored;
    }
  });
  return Object.keys(utms).length > 0 ? utms : null;
}

// Global Q&A Directory State
let allPublicQuestions = [];
let activeFilterTag = 'All';
let searchText = '';

const CATEGORY_TAGS = ['All', 'Interest Rates', 'Processing Fees', 'LTV & Funding', 'NRI Loans', 'Insurance with Home Loan', 'Documentation', 'General'];

const urlParams = new URLSearchParams(window.location.search);
const questionId = urlParams.get('id');
function showPage() {
  if (questionId) {
    renderQuestionView(questionId);
  } else {
    renderAskForm();
  }
}

    <!-- Main public Q&A container -->

        <!-- Right Column: The Form Card -->

function regenerateUsername() {
  currentUsername = `c/Peaceful-Loans-Home-Loans-${generateRandomNumber()}`;
  sessionStorage.setItem('anon_username', currentUsername);
  const usernameInput = document.getElementById('usernameInput');
  if (usernameInput) {
    usernameInput.value = currentUsername;
  }
}

function scrollToAskForm() {
  const formElement = document.getElementById('askForm');
  if (formElement) {
    formElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const questionText = document.getElementById('questionText');
    if (questionText) questionText.focus();
  }
}

async function submitQuestion(event) {
  event.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  const formStatus = document.getElementById('formStatus');
  const username = document.getElementById('usernameInput').value;
  const question = document.getElementById('questionText').value;
  const email = document.getElementById('emailInput').value;
  const tag = "General";

  submitBtn.disabled = true;
  submitBtn.innerText = "Posting question...";
  formStatus.style.display = "none";

  try {
    const res = await fetch('/api/questions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        username,
        question,
        email,
        tag,
        utm_params: getUtmParams(),
        referrer: sessionStorage.getItem('initial_referrer') || document.referrer || 'Direct',
        li_fat_id: sessionStorage.getItem('li_fat_id') || null
      })
    });

    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || 'Failed to submit question');
    }

    // Success! Redirect to query view parameter
    window.location.href = `?id=${data.id}`;
  } catch (err) {
    submitBtn.disabled = false;
    submitBtn.innerText = "Post Question Anonymously";
    formStatus.className = "status-banner status-error";
    formStatus.innerText = err.message;
    formStatus.style.display = "block";
  }
}

function selectFilterTag(tag, buttonEl) {
  activeFilterTag = tag;
  // Update active state in buttons
  const buttons = document.querySelectorAll('.tag-buttons .btn-tag');
  buttons.forEach(btn => btn.classList.remove('active'));
  buttonEl.classList.add('active');
  renderFilteredList();
}

function renderFilteredList() {
  const listEl = document.getElementById('directoryList');
  const countEl = document.getElementById('resultCount');
  if (!listEl) return;

  const filtered = allPublicQuestions.filter(q => {
    const matchesTag = activeFilterTag === 'All' || q.tag === activeFilterTag;
    const matchesSearch = !searchText || 
      q.question.toLowerCase().includes(searchText) || 
      (q.answer && q.answer.toLowerCase().includes(searchText));
    return matchesTag && matchesSearch;
  });

  if (countEl) {
    if (searchText || activeFilterTag !== 'All') {
      countEl.innerText = `Found ${filtered.length} answered question${filtered.length === 1 ? '' : 's'}`;
    } else {
      countEl.innerText = `Showing ${filtered.length} answered questions`;
    }
  }

  if (filtered.length === 0) {
    listEl.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--gray-400); font-size:14px; background:var(--c-surface); border:1px solid var(--gray-200); border-radius:8px;">No matching answered questions found. Try searching for keywords like "processing fee" or "LTV".</div>`;
    return;
  }

  listEl.innerHTML = filtered.map((q, idx) => `
    <div class="qa-accordion-item" style="background:var(--c-surface); border:1px solid var(--gray-200); border-radius:8px; overflow:hidden; transition:box-shadow 0.2s;">
      <div class="qa-accordion-header" onclick="toggleAccordion('${q.id}')" id="header-${q.id}" style="display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; padding:1.25rem; cursor:pointer; user-select:none;">
        <div style="flex:1">
          <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:11px;">
            <span style="font-family:monospace; font-weight:600; color:var(--gray-500);">${q.username}</span>
            <span class="status-badge answered" style="padding:0.1rem 0.35rem; font-size:9px; font-weight:600; margin-bottom:0;">${q.tag || 'General'}</span>
            <span style="color:var(--gray-400); margin-left:auto; font-size:11px; padding-right:0.25rem;">${q.created_at ? new Date(q.created_at).toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'}) : ''}</span>
          </div>
          <h3 style="font-size:15px; font-weight:600; color:var(--gray-900); line-height:1.4; margin:0;">
            ${q.question}
          </h3>
        </div>
        <span id="icon-${q.id}" style="font-size:18px; color:var(--gray-400); transition:transform 0.2s; align-self:center; display:flex;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
      <div class="qa-accordion-content" id="content-${q.id}" style="display:none; border-top:1px solid var(--gray-100); background:#fdfdfd; padding:1.25rem;">
        <div class="answer-card answered" style="margin-bottom:0; border:none; padding:0; background:transparent;">
          <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.75rem">
            <img src="/assets/icon-png.png" alt="Peaceful Loans" style="width:20px; height:20px; border-radius:4px; object-fit:contain;" />
            <span style="font-weight:600; font-size:13px; color:var(--gray-800)">Answered by Peaceful Loans</span>
          </div>
          <div style="font-size:14.5px; color:var(--gray-800); line-height:1.6; font-family:var(--font-serif)">
            ${q.answer ? q.answer.replace(/\\n/g, '<br>').replace(/\n/g, '<br>') : ''}
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleAccordion(id) {
  const content = document.getElementById(`content-${id}`);
  const icon = document.getElementById(`icon-${id}`);
  const header = document.getElementById(`header-${id}`);
  
  if (content.style.display === "block") {
    content.style.display = "none";
    icon.style.transform = "rotate(0deg)";
    header.style.background = "var(--c-surface)";
  } else {
    content.style.display = "block";
    icon.style.transform = "rotate(180deg)";
    header.style.background = "#f9fafb";
  }
}

window.onload = showPage;
</script>
</body>
