<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <!-- Organic Watercolor Wash Filter -->
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="14" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="2.2"/>
    </filter>

    <!-- Hand-Drawn Ink Pen Filter -->
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="inkNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="inkNoise" scale="1.35" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Fine Cross-Hatching Patterns for New Yorker Engraving Texture -->
    <pattern id="hatch45" width="6" height="6" patternTransform="rotate(35 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#111111" stroke-width="0.75" stroke-opacity="0.48"/>
    </pattern>
    <pattern id="hatchCross" width="6" height="6" patternTransform="rotate(25 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#111111" stroke-width="0.7" stroke-opacity="0.45"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#111111" stroke-width="0.65" stroke-opacity="0.35"/>
    </pattern>
    <pattern id="hatchDense" width="4" height="4" patternTransform="rotate(-35 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#111111" stroke-width="0.85" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Warm Cream Paper Background (#FFFDF9) -->
  <rect width="800" height="450" fill="#FFFDF9"/>
  <rect x="8" y="8" width="784" height="434" rx="6" fill="#FBF5E9" fill-opacity="0.45"/>

  <!-- Organic Watercolor Washes (Marigold #FFB919, Vermilion #FE5B04, Royal Blue #123FA1) -->
  <g filter="url(#wc)">
    <!-- Marigold Gold Wash behind the Balance Scale & Left Tray -->
    <ellipse cx="265" cy="235" rx="155" ry="95" fill="#FFB919" fill-opacity="0.42"/>
    <ellipse cx="400" cy="150" rx="130" ry="70" fill="#FFB919" fill-opacity="0.32"/>
    <!-- Vermilion Orange Wash behind the Right Tray (Heart & Home) -->
    <ellipse cx="535" cy="225" rx="145" ry="90" fill="#FE5B04" fill-opacity="0.34"/>
    <!-- Deep Royal Blue Wash along the Desk Shadow & Truth Ledger -->
    <ellipse cx="410" cy="340" rx="230" ry="68" fill="#123FA1" fill-opacity="0.32"/>
    <ellipse cx="210" cy="330" rx="110" ry="48" fill="#123FA1" fill-opacity="0.22"/>
  </g>

  <!-- All Hand-Drawn Pen & Ink Linework -->
  <g filter="url(#ink)" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">

    <!-- Wooden Study Desk Perspective Lines -->
    <line x1="55" y1="305" x2="745" y2="255" stroke-width="1.4" stroke-opacity="0.7"/>
    <line x1="38" y1="365" x2="762" y2="310" stroke-width="1.6" stroke-opacity="0.8"/>
    <line x1="75" y1="415" x2="735" y2="365" stroke-width="1.3" stroke-opacity="0.65"/>
    <path d="M110 332 C175 325, 220 328, 280 320" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M540 296 C610 290, 660 284, 720 280" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Open Fiduciary Ledger of Truth at the Base of the Desk -->
    <path d="M250 342 L398 328 L400 392 L232 406 Z" fill="#FFFDF9" stroke-width="2.2"/>
    <path d="M398 328 L552 340 L570 404 L400 392 Z" fill="#FFFDF9" stroke-width="2.2"/>
    <path d="M232 406 L400 392 L570 404 L574 414 L400 402 L228 416 Z" fill="url(#hatchDense)" stroke-width="2"/>
    <!-- Ruled ink lines inside the open ledger -->
    <line x1="262" y1="355" x2="382" y2="345" stroke-width="1.1"/>
    <line x1="258" y1="370" x2="382" y2="360" stroke-width="1.1"/>
    <line x1="254" y1="385" x2="382" y2="375" stroke-width="1.1"/>
    <line x1="416" y1="345" x2="536" y2="354" stroke-width="1.1"/>
    <line x1="416" y1="360" x2="540" y2="369" stroke-width="1.1"/>
    <line x1="416" y1="375" x2="544" y2="384" stroke-width="1.1"/>

    <!-- Ornate Brass Balance Scale Pedestal & Central Pillar -->
    <ellipse cx="400" cy="342" rx="64" ry="18" fill="#FFB919" stroke-width="2.4"/>
    <ellipse cx="400" cy="342" rx="58" ry="14" fill="url(#hatch45)" stroke-width="1.4"/>
    <ellipse cx="400" cy="334" rx="44" ry="12" fill="#FFF8E5" stroke-width="2"/>
    <!-- Central Brass Column with Cross-Hatching -->
    <path d="M391 112 L409 112 L414 332 L386 332 Z" fill="#FFB919" stroke-width="2.2"/>
    <path d="M400 112 L409 112 L414 332 L400 332 Z" fill="url(#hatch45)" stroke="none"/>
    <!-- Ornate Knobs on the Column -->
    <ellipse cx="400" cy="215" rx="16" ry="8" fill="#FFB919" stroke-width="2"/>
    <ellipse cx="400" cy="148" rx="14" ry="7" fill="#FFB919" stroke-width="2"/>
    <!-- Top Finial & Pointer Needle (Pointing Straight Up to True North / Unbiased Equilibrium) -->
    <path d="M400 44 L412 88 L400 82 L388 88 Z" fill="#FE5B04" stroke-width="2.2"/>
    <circle cx="400" cy="104" r="16" fill="#FFFDF9" stroke-width="2.4"/>
    <circle cx="400" cy="104" r="7" fill="#123FA1" stroke-width="1.8"/>

    <!-- Horizontal Balance Beam (Perfectly Level & Unbiased) -->
    <path d="M175 112 C240 94, 330 104, 400 104 C470 104, 560 94, 625 112 L625 122 C560 106, 470 114, 400 114 C330 114, 240 106, 175 122 Z" fill="#FFB919" stroke-width="2.3"/>
    <circle cx="175" cy="117" r="8" fill="#FE5B04" stroke-width="2"/>
    <circle cx="625" cy="117" r="8" fill="#FE5B04" stroke-width="2"/>

    <!-- LEFT SCALE PAN: FINANCIAL MATH & CUSTOMER SAVINGS -->
    <!-- Suspension Chains (Left) -->
    <line x1="175" y1="125" x2="118" y2="256" stroke-width="1.8" stroke-dasharray="5 3"/>
    <line x1="175" y1="125" x2="175" y2="262" stroke-width="1.6" stroke-dasharray="5 3"/>
    <line x1="175" y1="125" x2="232" y2="256" stroke-width="1.8" stroke-dasharray="5 3"/>

    <!-- Saved Gold Coins & Math Scroll Sitting on Left Pan -->
    <!-- Stack 1 of Saved Coins -->
    <ellipse cx="145" cy="246" rx="22" ry="7" fill="#FFB919" stroke-width="1.8"/>
    <path d="M123 236 V246 C123 250, 167 250, 167 246 V236" fill="#FFB919" stroke-width="1.8"/>
    <ellipse cx="145" cy="236" rx="22" ry="7" fill="#FFF3C4" stroke-width="1.8"/>
    <path d="M123 226 V236 C123 240, 167 240, 167 236 V226" fill="#FFB919" stroke-width="1.8"/>
    <ellipse cx="145" cy="226" rx="22" ry="7" fill="#FFB919" stroke-width="1.8"/>
    <path d="M123 216 V226 C123 230, 167 230, 167 226 V216" fill="#FFB919" stroke-width="1.8"/>
    <ellipse cx="145" cy="216" rx="22" ry="7" fill="#FFF8E5" stroke-width="1.8"/>

    <!-- Stack 2 of Saved Coins + Abacus/Math Card -->
    <rect x="172" y="196" width="46" height="54" rx="3" fill="#FFFDF9" stroke-width="2"/>
    <rect x="177" y="202" width="36" height="14" fill="#123FA1" fill-opacity="0.2" stroke-width="1.4"/>
    <line x1="180" y1="224" x2="210" y2="224" stroke-width="1.4"/>
    <line x1="180" y1="233" x2="210" y2="233" stroke-width="1.4"/>
    <line x1="180" y1="242" x2="202" y2="242" stroke-width="1.4"/>

    <!-- Left Brass Tray Dish -->
    <path d="M104 256 C104 282, 246 282, 246 256 Z" fill="#FFB919" stroke-width="2.3"/>
    <path d="M104 256 C104 282, 246 282, 246 256 Z" fill="url(#hatch45)" stroke="none"/>
    <ellipse cx="175" cy="256" rx="71" ry="11" fill="#FFF8E5" stroke-width="2"/>

    <!-- RIGHT SCALE PAN: EMOTIONS, PSYCHOLOGY OF MONEY & PEACEFUL HOME -->
    <!-- Suspension Chains (Right) -->
    <line x1="625" y1="125" x2="568" y2="256" stroke-width="1.8" stroke-dasharray="5 3"/>
    <line x1="625" y1="125" x2="625" y2="262" stroke-width="1.6" stroke-dasharray="5 3"/>
    <line x1="625" y1="125" x2="682" y2="256" stroke-width="1.8" stroke-dasharray="5 3"/>

    <!-- Peaceful Home & Human Heart Co-Authoring the Decision on the Right Pan -->
    <!-- House Walls -->
    <rect x="588" y="206" width="74" height="48" fill="#FFFDF9" stroke-width="2.1"/>
    <rect x="634" y="206" width="28" height="48" fill="url(#hatch45)" stroke="none"/>
    <!-- Pitched Roof -->
    <polygon points="578,208 625,170 672,208" fill="#FE5B04" fill-opacity="0.75" stroke-width="2.2"/>
    <polygon points="625,170 672,208 625,208" fill="url(#hatchCross)" stroke="none"/>
    <!-- Warm Lit Windows & Door -->
    <rect x="616" y="226" width="18" height="28" rx="9" fill="#FFB919" stroke-width="1.8"/>
    <rect x="596" y="218" width="13" height="14" fill="#FFB919" stroke-width="1.5"/>
    <rect x="641" y="218" width="13" height="14" fill="#FFB919" stroke-width="1.5"/>
    <!-- Heart Emblem Rising from the Chimney (Psychology & Emotion of Money) -->
    <path d="M625 156 C625 156, 608 144, 608 134 C608 127, 615 123, 621 127 C623 129, 625 132, 625 132 C625 132, 627 129, 629 127 C635 123, 642 127, 642 134 C642 144, 625 156, 625 156 Z" fill="#FE5B04" stroke-width="1.9"/>

    <!-- Right Brass Tray Dish -->
    <path d="M554 256 C554 282, 696 282, 696 256 Z" fill="#FFB919" stroke-width="2.3"/>
    <path d="M554 256 C554 282, 696 282, 696 256 Z" fill="url(#hatch45)" stroke="none"/>
    <ellipse cx="625" cy="256" rx="71" ry="11" fill="#FFF8E5" stroke-width="2"/>

    <!-- Foreground Left: Magnifying Glass Exposing Hidden Bank Clauses -->
    <circle cx="155" cy="356" r="30" fill="#FFFDF9" fill-opacity="0.88" stroke-width="3"/>
    <circle cx="155" cy="356" r="24" stroke-width="1.2"/>
    <path d="M138 345 C144 338, 155 336, 164 340" stroke-width="1.4"/>
    <path d="M132 376 L92 412" stroke="#123FA1" stroke-width="7" stroke-linecap="round"/>
    <path d="M132 376 L92 412" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Foreground Right: Fountain Pen of Truth -->
    <path d="M635 335 L718 398 L708 408 L625 345 Z" fill="#123FA1" stroke-width="2"/>
    <polygon points="610,328 635,335 625,345" fill="#FFB919" stroke-width="1.8"/>
    <line x1="610" y1="328" x2="622" y2="336" stroke-width="1.4"/>
  </g>
</svg>
