<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <!-- Organic Watercolor Wash Filter -->
    <filter id="wcTakumi" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="4" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="24" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="2"/>
    </filter>

    <!-- Hand-Drawn Ink Pen Filter -->
    <filter id="inkTakumi" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="3" seed="11" result="inkNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="inkNoise" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Fine Cross-Hatching Patterns for New Yorker Engraving Texture -->
    <pattern id="hatchTakumi1" width="5" height="5" patternTransform="rotate(35 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#111111" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="hatchTakumi2" width="5" height="5" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#111111" stroke-width="0.75" stroke-opacity="0.45"/>
      <line x1="0" y1="0" x2="5" y2="0" stroke="#111111" stroke-width="0.65" stroke-opacity="0.35"/>
    </pattern>
    <pattern id="samueWeave" width="6" height="6" patternTransform="rotate(15 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#111111" stroke-width="0.8" stroke-opacity="0.45"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#111111" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Warm Cream Paper Background (#FFFDF9) -->
  <rect width="800" height="450" fill="#FFFDF9"/>
  <rect x="8" y="8" width="784" height="434" rx="6" fill="#FBF5E9" fill-opacity="0.45"/>

  <!-- Organic Watercolor Washes (Marigold Gold #FFB919, Vermilion #FE5B04, Indigo Blue #123FA1) -->
  <g filter="url(#wcTakumi)">
    <!-- Rising Sun Gold Halo behind the Takumi Master -->
    <circle cx="405" cy="165" r="128" fill="#FFB919" fill-opacity="0.42"/>
    <!-- Indigo Watercolor Wash for Traditional Japanese Samue Craftsman Robe -->
    <ellipse cx="395" cy="265" rx="145" ry="85" fill="#123FA1" fill-opacity="0.34"/>
    <!-- Vermilion Orange Wash around the Precision Craft & Lamp -->
    <ellipse cx="565" cy="245" rx="115" ry="75" fill="#FE5B04" fill-opacity="0.32"/>
    <ellipse cx="235" cy="315" rx="120" ry="65" fill="#FFB919" fill-opacity="0.34"/>
  </g>

  <!-- All Hand-Drawn Pen & Ink Linework -->
  <g filter="url(#inkTakumi)" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">

    <!-- Background: Traditional Japanese Shoji Screen Lattice & Workshop Shelves -->
    <rect x="95" y="28" width="195" height="235" fill="#FFFDF9" fill-opacity="0.65" stroke-width="2"/>
    <line x1="160" y1="28" x2="160" y2="263" stroke-width="1.3"/>
    <line x1="225" y1="28" x2="225" y2="263" stroke-width="1.3"/>
    <line x1="95" y1="86" x2="290" y2="86" stroke-width="1.3"/>
    <line x1="95" y1="144" x2="290" y2="144" stroke-width="1.3"/>
    <line x1="95" y1="202" x2="290" y2="202" stroke-width="1.3"/>

    <!-- Right Background: Workshop Tool Rack & Hanging Chisels (Nomi) & Squares (Sashigane) -->
    <rect x="520" y="34" width="185" height="225" fill="#FFFDF9" fill-opacity="0.55" stroke-width="2"/>
    <line x1="520" y1="92" x2="705" y2="92" stroke-width="2.2"/>
    <!-- Hanging Japanese Chisel 1 -->
    <rect x="548" y="48" width="10" height="32" rx="2" fill="#FFB919" stroke-width="1.6"/>
    <rect x="550" y="80" width="6" height="36" fill="#FFFDF9" stroke-width="1.6"/>
    <!-- Hanging Japanese Chisel 2 -->
    <rect x="578" y="48" width="10" height="32" rx="2" fill="#FE5B04" stroke-width="1.6"/>
    <rect x="580" y="80" width="6" height="42" fill="#FFFDF9" stroke-width="1.6"/>
    <!-- Hanging Japanese Carpenter's Square (Sashigane) -->
    <path d="M618 52 H678 V62 H628 V138 H618 Z" fill="#FFB919" stroke-width="1.8"/>
    <!-- Hanging Brass Calipers -->
    <path d="M658 84 C644 102, 646 126, 658 140" stroke-width="2"/>
    <path d="M664 84 C678 102, 676 126, 664 140" stroke-width="2"/>
    <circle cx="661" cy="82" r="4" fill="#FE5B04" stroke-width="1.6"/>

    <!-- THE TAKUMI MASTER ARTISAN (60,000 Hours of Mastery & Curiosity) -->
    <!-- Indigo Samue Jacket Shoulders & Cross-Collar -->
    <path d="M255 312 C262 218, 305 182, 355 174 L445 174 C495 182, 534 218, 542 312 Z" fill="#123FA1" fill-opacity="0.28" stroke-width="2.4"/>
    <path d="M255 312 C262 218, 305 182, 355 174 L445 174 C495 182, 534 218, 542 312 Z" fill="url(#samueWeave)" stroke="none"/>
    <!-- Traditional Japanese Kimono/Samue V-Collar -->
    <path d="M352 170 L405 256 L448 170" fill="#FFFDF9" stroke-width="2.2"/>
    <path d="M364 170 L405 242 L436 170" fill="#FBF0E0" stroke-width="1.8"/>
    <line x1="405" y1="256" x2="385" y2="312" stroke-width="2.2"/>

    <!-- Takumi Master's Head, Silver Hair, Hachimaki Headband & Round Spectacles -->
    <path d="M354 114 C354 74, 446 74, 446 114 C446 158, 428 188, 400 188 C372 188, 354 158, 354 114 Z" fill="#FFFDF9" stroke-width="2.2"/>
    <!-- Distinguished Artisan Hair & Topknot/Bun -->
    <path d="M348 112 C344 76, 372 54, 402 54 C432 54, 456 76, 452 112 C444 96, 424 88, 400 88 C376 88, 356 96, 348 112 Z" fill="url(#hatchTakumi2)" stroke-width="2"/>
    <ellipse cx="400" cy="50" rx="22" ry="12" fill="url(#hatchTakumi2)" stroke-width="2"/>
    <!-- Traditional Craftsman Headband (Hachimaki) -->
    <path d="M351 102 C375 95, 425 95, 449 102 L448 112 C425 105, 375 105, 352 112 Z" fill="#FE5B04" stroke-width="1.8"/>
    <!-- Ears -->
    <path d="M353 122 C345 122, 345 144, 355 146" fill="#FFFDF9" stroke-width="1.8"/>
    <path d="M447 122 C455 122, 455 144, 445 146" fill="#FFFDF9" stroke-width="1.8"/>
    <!-- Round Precision Spectacles + Jeweler's Loupe -->
    <circle cx="382" cy="132" r="14" fill="#FFFDF9" stroke-width="2.2"/>
    <circle cx="418" cy="132" r="14" fill="#FFB919" fill-opacity="0.35" stroke-width="2.6"/>
    <circle cx="418" cy="132" r="10" fill="#FFFDF9" stroke-width="1.6"/>
    <line x1="396" y1="132" x2="404" y2="132" stroke-width="2"/>
    <line x1="354" y1="126" x2="368" y2="130" stroke-width="1.8"/>
    <line x1="432" y1="130" x2="446" y2="126" stroke-width="1.8"/>
    <!-- Focused Eyes Looking Down at the Craft -->
    <path d="M376 133 C380 136, 385 136, 388 133" stroke-width="2"/>
    <circle cx="418" cy="133" r="2.5" fill="#111111"/>
    <!-- Nose, Mustache & Calm Master Expression -->
    <path d="M400 132 L397 152 L404 154" stroke-width="1.8"/>
    <path d="M382 165 C392 160, 408 160, 418 165" stroke-width="2"/>
    <path d="M388 172 C396 176, 404 176, 412 172" stroke-width="1.5"/>

    <!-- TAKUMI WORKBENCH & PRECISION TOOLS -->
    <path d="M48 312 L752 312 L780 432 L20 432 Z" fill="#FFFDF9" stroke-width="2.4"/>
    <line x1="65" y1="342" x2="735" y2="342" stroke-width="1.1" stroke-opacity="0.45"/>
    <line x1="45" y1="388" x2="755" y2="388" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- Centerpiece on Workbench: Intricate Japanese Kumiko Geometric Joinery & Cut Diamond -->
    <!-- Blueprint Mat Underneath -->
    <polygon points="275,326 525,326 552,412 248,412" fill="#FFF8E5" stroke-width="2"/>
    <polygon points="285,333 515,333 538,404 262,404" fill="none" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Interlocking Kumiko / Faceted Diamond-Cut Architecture Being Perfected -->
    <polygon points="400,248 456,282 456,348 400,382 344,348 344,282" fill="#FFB919" fill-opacity="0.38" stroke-width="2.4"/>
    <polygon points="400,248 456,282 400,315 344,282" fill="#FFFDF9" stroke-width="2"/>
    <polygon points="344,282 400,315 400,382 344,348" fill="url(#hatchTakumi1)" stroke-width="2"/>
    <polygon points="456,282 400,315 400,382 456,348" fill="#FFB919" fill-opacity="0.55" stroke-width="2"/>
    <!-- Internal Kumiko Precision Lattice Lines -->
    <line x1="400" y1="248" x2="400" y2="382" stroke-width="1.6"/>
    <line x1="344" y1="282" x2="456" y2="348" stroke-width="1.6"/>
    <line x1="456" y1="282" x2="344" y2="348" stroke-width="1.6"/>
    <circle cx="400" cy="315" r="8" fill="#FE5B04" stroke-width="1.8"/>

    <!-- Artisan's Left & Right Hands Holding Precision Brass Calipers & Fine Chisel -->
    <!-- Left Sleeve & Hand Holding Brass Vernier Caliper against the Joinery -->
    <path d="M268 258 L322 292 L302 325 L242 292 Z" fill="#123FA1" fill-opacity="0.5" stroke-width="2.2"/>
    <ellipse cx="324" cy="306" rx="18" ry="13" fill="#FFFDF9" stroke-width="2"/>
    <path d="M332 296 L368 274" stroke="#FE5B04" stroke-width="3.2"/>
    <path d="M334 310 L368 318" stroke="#FE5B04" stroke-width="3.2"/>

    <!-- Right Sleeve & Hand Holding Fine Japanese Chisel / Engraving Stylus -->
    <path d="M532 258 L478 292 L498 325 L558 292 Z" fill="#123FA1" fill-opacity="0.5" stroke-width="2.2"/>
    <ellipse cx="476" cy="306" rx="18" ry="13" fill="#FFFDF9" stroke-width="2"/>
    <path d="M482 292 L428 272" stroke="#111111" stroke-width="3.5"/>

    <!-- Left Foreground on Workbench: Traditional Japanese Kanna Wood-Plane & Stacked System Notebooks -->
    <!-- Stacked System Mitigation Ledgers -->
    <rect x="82" y="338" width="136" height="22" rx="2" fill="#FFFDF9" stroke-width="2"/>
    <rect x="88" y="318" width="128" height="20" rx="2" fill="#FFB919" stroke-width="2"/>
    <rect x="94" y="298" width="120" height="20" rx="2" fill="#123FA1" fill-opacity="0.35" stroke-width="2"/>
    <!-- Japanese Kanna Wood Plane on Workbench -->
    <polygon points="112,374 218,364 226,396 104,406" fill="#FFB919" stroke-width="2"/>
    <polygon points="154,346 182,344 176,382 148,384" fill="#FFFDF9" stroke-width="2"/>

    <!-- Right Foreground on Workbench: Rolled Scrolls & Saraswati Knowledge Inkpot -->
    <ellipse cx="615" cy="364" rx="12" ry="20" fill="#FFB919" stroke-width="2"/>
    <path d="M615 344 L712 334 C722 334, 724 374, 712 374 L615 384" fill="#FFFDF9" stroke-width="2"/>
    <ellipse cx="645" cy="396" rx="10" ry="16" fill="#FE5B04" stroke-width="2"/>
    <path d="M645 380 L736 372 C744 372, 746 404, 736 404 L645 412" fill="#FFFDF9" stroke-width="2"/>
  </g>
</svg>
