      <h1 class="article-title">How the spread impacts your home loan EMI</h1>
      <p class="article-meta">By Ananya Grover · 10th June 2026</p>

      <div class="article-actions">
        <a href="https://www.livemint.com/money/personal-finance/rbi-repo-rate-cut-home-loan-interest-rates-spread-cibil-score-eblr-banks-11781020028208.html" target="_blank" rel="noopener" class="btn btn-primary">View on Mint →</a>
      </div>

      <article class="article-body">
        <p>As lenders reserve their lowest rates for borrowers with 800-plus credit scores, spreads are becoming as important as the repo rate in determining home loan costs.</p>

        <p>The Reserve Bank of India (RBI) cut the repo rate by 125 basis points to 5.25% through 2025 before shifting to a neutral stance and keeping rates unchanged at its last two policy meetings.</p>

        <p>Repo rate is the rate at which the central bank lends to other banks, serving as the benchmark interest rate that influences most floating-rate home loans linked to the External Benchmark Lending Rate (EBLR). For home-loan borrowers, that should have meant cheaper loans. But a closer look may reveal a different picture.</p>

        <p>The reason lies in a less visible component of loan pricing: the spread. Understanding it can make the difference between assuming you are benefiting from a rate cut and discovering that much of the benefit has been offset by the bank's pricing decisions.</p>

        <h2>How does it work?</h2>

        <p>Since October 2019, the RBI has required banks to link all floating-rate retail loans to an external benchmark, typically the repo rate. This pricing system is commonly referred to as the EBLR.</p>

        <p>When the repo rate changes, the benchmark rate changes as well. But the interest rate a borrower ultimately pays is made up of two parts: the benchmark and a spread. The benchmark is linked to the RBI's policy rate, whereas the spread is determined by the bank and reflects factors such as the borrower's credit profile, loan-to-value ratio, operating costs and commercial considerations.</p>

        <p>For new loans, under the banking regulator's EBLR framework, banks are free to determine their own spreads. While credit-risk factors such as credit scores and loan-to-value ratios play an important role, lenders also have discretion to factor in broader commercial considerations and customer relationships when pricing loans.</p>

        <p>For existing loans, Mukesh Chand, senior counsel, Economic Laws Practice, explained that while RBI guidelines generally provide that the spreads should not be increased during the tenure of the loan, an increase in the credit-risk premium component of the spread may be permissible where there is a significant deterioration in the borrower’s credit profile.</p>

        <p>Banks retain discretion in terms of board-approved policies, the loan contract, and the RBI framework for reviewing and revising components of the spread. However, he added, banks generally don't increase spreads for existing borrowers because of the competitive landscape and customer retention considerations.</p>

        <p>These policies are mentioned in the loan agreements, as the RBI mandates that banks disclose any provisions or clauses that allow for the revision of the costs of various components in the spread.</p>

        <div class="highlight-quote">
          <p>"Understanding the spread can make the difference between assuming you are benefiting from an RBI rate cut and discovering that much of the benefit has been offset by the bank's pricing decisions."</p>
          <footer>— Mint Money Summary</footer>
        </div>

        <h2>How important is a credit score?</h2>

        <p>An analysis of historical home loan rates offered by the country's five largest banks shows that between February 2025, when the RBI began its rate-cut cycle, and the end of May 2026, lenders reduced home loan rates by 65 to 125 basis points. While some passed on the full benefit of the repo rate cuts, others transferred only half of it by increasing spreads for new borrowers.</p>

        <p>However, the advertised rates apply only to borrowers with exceptional credit profiles, typically those with credit scores above 780-800. According to a TransUnion CIBIL report, the average credit score among monitoring consumers stood at 728 as of December 2025.</p>

        <p>For borrowers with scores below 780, the picture looks very different. In some cases, home loan rates for new borrowers have increased despite the RBI's 2025 easing cycle, driven by a widening spread.</p>

        <p>Data from Peaceful-Loans, a home loan advisory company, shows that State Bank of India, which reserves its lowest rates for borrowers with CIBIL scores of 825 and above, increased rates for the 750-824 score bucket from 7.55% on or before 31 March to 7.70% from 1 April 2026 on new loans. Similarly, ICICI Bank raised rates for borrowers with scores between 780 and 799 from 7.30% to 7.60%, while Union Bank of India increased rates for the 750-799 category from 7.3% to 7.35% over the same period.</p>

        <p>Amit Prakash, co-founder and chief business officer of Urban Money, a loan advisory platform, said banks have increasingly adopted sharper risk-based pricing models. "As a result, the transmission of lower rates is not uniform across all borrower segments," he said.</p>

        <p>Prakash said banks are increasingly reserving their most competitive rates for borrowers with scores above 780-800, while widening spreads for the 700-780 segment. He said lenders are differentiating more aggressively based on credit quality, repayment behaviour, income stability and overall risk assessment.</p>

        <div class="highlight-quote">
          <p>"A credit score above 780 or 800 is genuinely rare, and only an estimated 10-20% of borrowers reach that level. Banks increasingly treat the 750-799 band as a statistical grey zone when it comes to longer tenure home loans. The borrower is not risky enough to reject, but not clean enough to fully trust over a 20-30 year tenure."</p>
          <footer>— Harsh Grover, Co-founder of LoansJagat</footer>
        </div>

        <h2>What do rising spreads mean?</h2>

        <p>Even small differences in spreads can have a meaningful impact over a 15-20 year loan tenure, said Adhil Shetty, CEO of BankBazaar.</p>

        <p>Consider a borrower taking a home loan of ₹80 lakh for 20 years. At an interest rate of 8%, the EMI works out to approximately ₹66,900, and the total interest paid over the loan tenure comes to around ₹80.6 lakh. If the rate rises by just 10 basis points to 8.10%, the EMI increases to roughly ₹67,400, and the total interest paid rises to about ₹81.8 lakh. That seemingly small increase adds nearly ₹1.2 lakh in interest costs over the life of the loan. A 25-50 basis point increase can translate into several lakhs of additional interest.</p>

        <div class="highlight-quote">
          <p>"When three or four large banks control roughly 60-65% of the home loan market, they gain considerable pricing power. Some lenders have used that advantage over the past 12-14 months by gradually increasing spreads for new borrowers whenever market conditions allow. They increase the margin by around 15 basis points and observe whether volumes fall. If demand remains stable, the higher spread directly benefits bank profitability."</p>
          <footer>— Mangesh Zope, Founder of Peaceful-Loans</footer>
        </div>

        <p>For example, he said SBI's home loan rate for a borrower with the same CIBIL score is currently about 0.3 percentage points higher than it was 12-14 months ago. According to Zope, these changes primarily affect new borrowers.</p>

        <h2>How to navigate?</h2>

        <p>Shetty believes that a borrower may focus on RBI rate decisions, but the spread applied by the lender ultimately determines the final borrowing cost. "Borrowers with similar profiles may receive materially different loan offers across banks. If the gap between a borrower's existing rate and prevailing market rates becomes significant, refinancing or negotiating with the existing lender may help reduce the overall interest burden," he said.</p>

        <p>Mohan advises borrowers to monitor their credit scores and seek a rate review if their score rises above 800. If the lender refuses, borrowers can use competing loan offers to negotiate or refinance. He also recommends considering a home-loan overdraft facility, where surplus funds parked in the linked account reduce the balance on which interest is charged.</p>

        <p>As lenders sharpen risk-based pricing and reserve their best rates for borrowers closer to the 800-plus range, the spread has become almost as important as the repo rate in determining borrowing costs. For borrowers, comparing lenders, monitoring credit scores and periodically reviewing loan terms may matter as much as the next RBI rate move.</p>
