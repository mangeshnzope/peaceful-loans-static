        <h2>Bank of Baroda Cuts Rates by 5 bps Despite RBI Hike</h2>

        <p>While most home loans carry floating rates tied to external benchmarks like the repo rate, select lenders absorbed part of the hike through festive spread reductions to meet volume and profitability targets.</p>

        <p>Quoting <strong>Mangesh Zope</strong>, founder of independent home loan advisory firm <strong>Peaceful Loans</strong>, the article reveals how pricing moved on the ground:</p>

        </div>

        <p>In response to Mint's questions, Bank of Baroda confirmed its festive home loan campaign offers rates starting at <strong>7.40% a year</strong>, quick sanctions, and a full processing-fee waiver until 31 October. Women get an additional 5 bps discount, while eligible borrowers under 40, salary-account holders, high-net-worth individuals, and Baroda Radiance customers get 10 bps off.</p>

        <div class="highlight-quote">
          <p>&ldquo;Zope said processing-fee waivers are useful for affordable housing loans. Bigger home-loan borrowers often seek full or partial refunds from banks or cashback from agents, even outside the festive season. A fee waiver lowers upfront costs, but a slightly lower interest rate could deliver greater long-term savings...&rdquo;</p>

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
