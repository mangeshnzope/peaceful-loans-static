      <h1 class="article-title">Retail investors piled into the unlisted market’s favourite stock. Regret followed</h1>

        <a href="https://the-ken.com/story/retail-investors-piled-into-the-unlisted-markets-favourite-stock-regret-followed/" target="_blank" rel="noopener" class="btn btn-primary">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.45a1.6 1.6 0 0 0-1.6 1.6 1.6 1.6 0 0 0 1.6 1.6 1.6 1.6 0 0 0 1.6-1.6 1.6 1.6 0 0 0-1.6-1.6Z"/></svg>
          Founder's LinkedIn Post →

      <div class="founder-pov-box">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            Founder's Perspective · Mangesh Zope

          <span style="font-size:13px; color:#6b7280;">From LinkedIn Reflections</span>

        <p><strong>I made a financial mistake I still regret, and The Ken quoted this today.</strong></p>
        <p>I bought Reliance Retail in the unlisted market at around ₹1,200. It rose to nearly ₹4,000. Then the company bought me out at ₹1,362 without my consent or control. That was July 2023. I didn't know a company could suddenly decide to buy back all your shares at whatever price it likes.</p>
        <p>I was given an exit, and I didn't even take it. My experience was shared in <em>The Ken</em> in a piece on the National Stock Exchange (NSE) listing, where around 70,000 retail investors bought too late to sell in the IPO and sat locked in until March 2027.</p>
        <p><strong>This is the part I'd want anyone buying their first home to read:</strong></p>
        <p>I had advisors, but I didn't listen, because I had convinced myself I understood the asset. Anyone buying an asset with opaque pricing for the first time is better off with an independent advisor, and I'm saying that as the one who got it wrong.</p>
        <p>My loss was on paper, and the gains were too, until they disappeared. But with your first home, the money is real, and the cost of a mistake is permanent. It’s the exact same problem with a different asset: you can’t see a reliable market price, sell whenever you want, or control the fine print.</p>
        <p><em>That's an unlisted share. It's also a ₹3 crore flat. Where the money isn't transparent, the person who knows least pays.</em></p>
      </div>

      <article class="article-body">
        <p>After almost a decade of anticipation, the National Stock Exchange (NSE) finally listed on 24 September. But behind the celebratory headlines lay an expensive reckoning for retail investors who had rushed into the unlisted gray market expecting guaranteed riches.</p>

        <p>While institutional allocations were priced at ₹1,785 per share, tens of thousands of retail investors had paid between ₹1,800 and ₹2,200 in the private market during the frenzy between April 2025 and mid-2026. Nearly 70,000 of them bought too late to tender into the IPO, finding themselves legally locked in until March 2027 under SEBI’s mandatory six-month post-listing lock-in rules—only to watch the stock fall below its issue price to ₹1,695.</p>

        <p>In this in-depth investigative feature by <strong>Tanmay Hardikar</strong> for <em>The Ken</em>, market experts unpack the structural flaws of India's unlisted market, where opaque pricing, broker markups, and regulatory grey zones routinely trap individual buyers.</p>

        <h2>"There's No Medicine for Greed"</h2>

        <p>NSE is not an isolated incident; it follows a predictable cascade of unlisted market heartbreaks including Reliance Retail, HDB Financial, Tata Capital, and SBI Funds Management—all of which traded at inflated private valuations before reality caught up.</p>

        <p>Quoted in the piece, <strong>Mangesh Zope</strong>, founder of home loan advisory firm <strong>Peaceful Loans</strong>, shared his own chastening experience from the Reliance Retail buyout:</p>

        <div class="highlight-quote">
          <p>"NSE offers an expensive lesson not to fall for hype. But Mangesh Zope, founder of the advisory firm Peaceful Loans who learnt the hard way with the Reliance Retail debacle, isn’t holding out hope. &lsquo;There’s no medicine for greed,&rsquo; he says."</p>
          <footer>— The Ken (Published 23rd October 2026)</footer>
        </div>

        <p>Zope had bought Reliance Retail shares at around ₹1,200 and watched them climb toward ₹4,000 on paper. But in July 2023, the company initiated a capital reduction scheme, unilaterally buying out minority shareholders at ₹1,362 per share:</p>

        <div class="highlight-quote">
          <p>"Zope learnt his lesson with Reliance Retail. He bought at about Rs 1,200 and watched his shares climb to nearly Rs 4,000, only for the company to buy him out at Rs 1,362 in July 2023, wiping out almost all his gains. &lsquo;I didn’t know a company could suddenly decide to buy back all your shares at whatever price it likes,&rsquo; he says."</p>
          <footer>— The Ken (Published 23rd October 2026)</footer>
        </div>

        <h2>Why Regulation Alone Cannot Protect Uninformed Buyers</h2>

        <p>Despite repeated cautions from SEBI regarding unregulated pre-IPO platforms, thousands of new retail buyers continue to chase speculative momentum. When asked about regulatory intervention, Zope highlighted the reality of financial human psychology:</p>

        <div class="highlight-quote">
          <p>"Zope puts it more simply. &lsquo;Shutting the casino doesn’t stop the gambling,&rsquo; he argues. &lsquo;You can only learn from someone else’s mistakes.&rsquo;"</p>
          <footer>— Mangesh Zope, Quoted in The Ken</footer>
        </div>

        <h2>The Parallel: Unlisted Shares vs. The ₹3 Crore Home Purchase</h2>

        <p>While the article focuses on equity markets, the psychological and economic mechanisms are identical to what retail borrowers experience when buying real estate and signing home loans:</p>

        <ul>
          <li><strong>Information Asymmetry:</strong> In unlisted stocks, brokers pocket markups of ₹150–200 per share while buyers have zero transparency into true institutional demand. In home loans, bank relationship managers push high-margin insurance bundles and obscure spread reset terms because their incentives are aligned with lender quotas, not the borrower.</li>
          <li><strong>Illiquidity and Exit Traps:</strong> In private equities, selling requires cumbersome physical paperwork and finding a counterparty. In real estate, liquidating a ₹2–3 crore property or escaping an unviable EMI takes months or years.</li>
          <li><strong>The Illusion of Complete Control:</strong> Buyers often convince themselves they understand the asset—whether a pre-IPO company or a builder loan agreement—only to realize that fine-print clauses dictate their financial fate.</li>
        </ul>

        <p>At <strong>Peaceful Loans</strong>, our entire advisory model is built to solve this exact structural flaw. By representing borrowers as independent fiduciaries rather than agents of banks, we eliminate the asymmetric information that allows financial institutions to profit at the borrower's expense.</p>
      </article>
