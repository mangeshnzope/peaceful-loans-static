        <h2>Article Summary & Context</h2>
        <p>The year 2025 saw the Reserve Bank of India (RBI) embark on an aggressive easing cycle, reducing the repo rate by 125 basis points to 5.25%. While bank borrowers linked to external benchmarks saw relief, NBFC borrowers experienced much slower rate transmission.</p>

        <div class="highlight-quote">

        </div>

        <p>The article explores why transmission is uneven, particularly in the NBFC segment where loans are often linked to internal benchmarks like the Prime Lending Rate (PLR). According to RBI data, while banks passed on nearly 87 basis points of the cut, NBFCs passed on only 12 basis points.</p>

        <h2>Key Insights for Borrowers</h2>
        <ul>
          <li><strong>NBFC vs Banks:</strong> NBFC loans are suitable for gram panchayat properties or irregular income, but they come with higher rates and slower transmission.</li>
          <li><strong>The Tenure Trap:</strong> Banks often extend loan tenures instead of increasing EMIs during rate hikes, which can add years to your loan without you noticing.</li>
          <li><strong>Refinancing Strategy:</strong> For older MCLR-linked loans or NBFC loans, moving to a repo-linked product can save 1-2% in interest.</li>
