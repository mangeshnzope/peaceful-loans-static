<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Admin Q&A Dashboard — Peaceful Loans</title>
  <link rel="icon" type="image/jpeg" href="/assets/icon-jpg.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=15">
</head>
<body>
<div id="app"></div>
<script src="/components.js?v=2"></script>
<script>
let adminSecret = sessionStorage.getItem('admin_secret') || '';
let allQuestions = [];

function showPage() {
  if (!adminSecret) {
    renderLogin();
  } else {
    renderDashboard();
  }
}

function renderLogin() {
  document.getElementById('app').innerHTML = `
    ${navHTML('/ask.html')}
    
    <div class="page-header">
      <div class="container-sm text-center">
        <p class="section-label section-label-gray">Security Check</p>
        <h1>Admin Q&A Login</h1>
      </div>
    </div>

    <div class="container-xs" style="padding-top:1rem; padding-bottom:5rem;">
      <div class="ask-card">
        <form onsubmit="handleLogin(event)">
          <div class="form-group" style="margin-bottom:1.5rem">
            <label for="secretInput" style="display:block; font-weight:500; font-size:14px; margin-bottom:0.5rem; color:var(--gray-800)">Enter Admin Secret Passphrase</label>
            <input type="password" id="secretInput" required placeholder="••••••••••••" style="width:100%; padding:0.75rem; border:1px solid var(--gray-200); border-radius:6px; font-family:inherit; font-size:14px; outline:none; transition:border-color 0.2s;" />
          </div>
          <div id="loginStatus" style="display:none; padding:1rem; border-radius:6px; font-size:14px; margin-bottom:1.5rem;" class="status-banner status-error"></div>
          <button type="submit" class="btn btn-primary" style="width:100%">Authenticate</button>
        </form>
      </div>
    </div>

    ${footerHTML()}
  `;
  initNav();
}

function handleLogin(event) {
  event.preventDefault();
  const inputVal = document.getElementById('secretInput').value;
  adminSecret = inputVal;
  sessionStorage.setItem('admin_secret', adminSecret);
  renderDashboard();
}

async function renderDashboard() {
  document.getElementById('app').innerHTML = `
    ${navHTML('/ask.html')}
    
    <div class="page-header">
      <div class="container-sm text-center">
        <p class="section-label section-label-gray">Control Panel</p>
        <h1>Q&A Moderation Dashboard</h1>
        <p style="margin-top:1.25rem">Manage anonymous borrower queries, write answers, and track emails.</p>
        <div style="margin-top:1rem; display:flex; justify-content:center; gap:0.75rem; flex-wrap:wrap;">
          <button onclick="downloadQuestionsCSV()" class="btn btn-outline-gray btn-sm">Download CSV</button>
          <button onclick="logoutAdmin()" class="btn btn-outline-gray btn-sm">Sign Out</button>
        </div>
      </div>
    </div>

    <div class="container-sm" style="padding-top:1rem; padding-bottom:5rem;" id="dashboardContent">
      <div class="ask-card text-center" style="padding:3rem 2rem;">
        <div style="font-size:14px; color:var(--gray-500)">Loading questions...</div>
      </div>
    </div>

    ${footerHTML()}
  `;
  initNav();

  const dashboardContent = document.getElementById('dashboardContent');

  try {
    const res = await fetch(`/api/admin/questions?secret=${encodeURIComponent(adminSecret)}`);
    const questions = await res.json();

    if (!res.ok) {
      throw new Error(questions.error || 'Failed to load questions.');
    }

    allQuestions = questions;

    const unanswered = questions.filter(q => q.status === 'pending');
    const answered = questions.filter(q => q.status === 'answered');

    let unansweredHTML = '<div style="font-size:14px; color:var(--gray-500); padding:2rem 0;">No pending questions to answer.</div>';
    if (unanswered.length > 0) {
      unansweredHTML = unanswered.map(q => `
        <div class="ask-card" style="margin-bottom:1.5rem; border-left:4px solid var(--blue)">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--gray-100); padding-bottom:0.75rem; margin-bottom:1rem;">
            <div style="width: 100%;">
              <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.4rem;">
                <span style="font-family:monospace; font-weight:600; color:var(--blue); font-size:14px;">${q.username}</span>
                <span class="status-badge pending" style="font-size:9px; padding:0.15rem 0.35rem;">${q.tag || 'General'}</span>
                ${q.email ? `<span style="font-size:12px; color:var(--gray-500); border-left:1px solid var(--gray-200); padding-left:0.5rem;">📧 ${q.email}</span>` : ''}
              </div>
              ${renderTrackingDetails(q)}
            </div>
            <span style="font-size:12px; color:var(--gray-400); white-space:nowrap; margin-left:1rem;">${new Date(q.created_at).toLocaleString()}</span>
          </div>
          <p style="font-size:15px; color:var(--gray-800); line-height:1.5; margin-bottom:1.5rem; font-weight:500;">
            ${q.question.replace(/\n/g, '<br>')}
          </p>
          <div style="border-top:1px solid var(--gray-100); padding-top:1.5rem">
            <h4 style="font-size:13px; font-weight:600; text-transform:uppercase; color:var(--gray-700); margin-bottom:0.5rem">Assign Category & Write Response</h4>
            <div style="margin-bottom:0.75rem">
              <select id="answerTag-${q.id}" style="padding:0.4rem 0.75rem; border:1px solid var(--gray-200); border-radius:6px; font-family:inherit; font-size:13px; outline:none; background:#fff;">
                <option value="General">General Query</option>
                <option value="Interest Rates">Interest Rates</option>
                <option value="Processing Fees">Processing Fees</option>
                <option value="LTV & Funding">LTV & Funding</option>
                <option value="NRI Loans">NRI Loans</option>
                <option value="Insurance with Home Loan">Insurance with Home Loan</option>
                <option value="Documentation">Documentation & Process</option>
              </select>
            </div>
            <textarea id="answerText-${q.id}" placeholder="Provide expert response..." style="width:100%; height:120px; padding:0.75rem; border:1px solid var(--gray-200); border-radius:6px; font-family:inherit; font-size:14px; line-height:1.5; outline:none; resize:vertical; margin-bottom:0.75rem;"></textarea>
            <div style="display:flex; justify-content:flex-end">
              <button onclick="submitAnswer('${q.id}')" id="answerBtn-${q.id}" class="btn btn-primary btn-sm">Post Answer</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    let answeredHTML = '<div style="font-size:14px; color:var(--gray-500); padding:2rem 0;">No answered questions in the archive.</div>';
    if (answered.length > 0) {
      answeredHTML = answered.map(q => `
        <div class="ask-card" style="margin-bottom:1.5rem; background:#f9fafb; opacity:0.95;">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--gray-100); padding-bottom:0.75rem; margin-bottom:1rem;">
            <div style="width: 100%;">
              <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.4rem;">
                <span style="font-family:monospace; font-weight:600; color:var(--gray-600); font-size:14px;">${q.username}</span>
                <span class="status-badge pending" style="font-size:9px; padding:0.15rem 0.35rem;">${q.tag || 'General'}</span>
                ${q.email ? `<span style="font-size:12px; color:var(--gray-400); border-left:1px solid var(--gray-200); padding-left:0.5rem;">📧 ${q.email}</span>` : ''}
              </div>
              ${renderTrackingDetails(q)}
            </div>
            <span style="font-size:12px; color:var(--gray-400); white-space:nowrap; margin-left:1rem;">${new Date(q.created_at).toLocaleString()}</span>
          </div>
          <p style="font-size:14px; color:var(--gray-600); line-height:1.5; margin-bottom:1.25rem;">
            ${q.question.replace(/\n/g, '<br>')}
          </p>
          <div style="border-top:1px solid var(--gray-100); padding-top:1rem; background:#fff; border-radius:6px; padding:1rem; border:1px solid var(--gray-200)">
            <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem">
              <img src="/assets/icon-png.png" alt="Peaceful Loans" style="width:16px; height:16px; border-radius:2px; object-fit:contain;" />
              <span style="font-weight:600; font-size:11px; color:#166534; text-transform:uppercase; letter-spacing:0.02em;">Answered by Peaceful Loans</span>
            </div>
            <p style="font-size:14.5px; color:var(--gray-800); line-height:1.6; font-family:var(--font-serif)">
              ${q.answer.replace(/\\n/g, '<br>').replace(/\n/g, '<br>')}
            </p>
          </div>
          <div style="border-top:1px solid var(--gray-100); padding-top:0.75rem; margin-top:0.75rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
            <span style="font-size:12px; color:var(--gray-500); font-weight:500;">Change Category:</span>
            <select id="editTag-${q.id}" onchange="updateQuestionTag('${q.id}')" style="padding:0.25rem 0.5rem; border:1px solid var(--gray-200); border-radius:6px; font-family:inherit; font-size:12px; outline:none; background:#fff; cursor:pointer;">
              <option value="General" ${q.tag === 'General' ? 'selected' : ''}>General Query</option>
              <option value="Interest Rates" ${q.tag === 'Interest Rates' ? 'selected' : ''}>Interest Rates</option>
              <option value="Processing Fees" ${q.tag === 'Processing Fees' ? 'selected' : ''}>Processing Fees</option>
              <option value="LTV & Funding" ${q.tag === 'LTV & Funding' ? 'selected' : ''}>LTV & Funding</option>
              <option value="NRI Loans" ${q.tag === 'NRI Loans' ? 'selected' : ''}>NRI Loans</option>
              <option value="Insurance with Home Loan" ${q.tag === 'Insurance with Home Loan' ? 'selected' : ''}>Insurance with Home Loan</option>
              <option value="Documentation" ${q.tag === 'Documentation' ? 'selected' : ''}>Documentation & Process</option>
            </select>
            <span id="updateStatus-${q.id}" style="font-size:11px; font-weight:600; display:none; margin-left:0.25rem;"></span>
          </div>
        </div>
      `).join('');
    }

    dashboardContent.innerHTML = `
      <div style="margin-bottom:3rem">
        <h2 style="font-family:var(--font-serif); font-size:1.8rem; border-bottom:2px solid var(--blue); padding-bottom:0.5rem; margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center">
          <span>Unanswered Questions</span>
          <span class="badge" style="background:var(--blue); color:#fff; font-size:14px; padding:0.25rem 0.6rem; border-radius:12px;">${unanswered.length}</span>
        </h2>
        ${unansweredHTML}
      </div>

      <div>
        <h2 style="font-family:var(--font-serif); font-size:1.8rem; border-bottom:2px solid var(--gray-400); padding-bottom:0.5rem; margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center">
          <span>Answered Archive</span>
          <span class="badge" style="background:var(--gray-400); color:#fff; font-size:14px; padding:0.25rem 0.6rem; border-radius:12px;">${answered.length}</span>
        </h2>
        ${answeredHTML}
      </div>
    `;

  } catch (err) {
    sessionStorage.removeItem('admin_secret');
    dashboardContent.innerHTML = `
      <div class="ask-card text-center" style="padding:3rem 2rem; border-color:#fee2e2;">
        <h3 style="color:#ef4444; margin-bottom:0.5rem">Authentication Failed</h3>
        <p style="color:var(--gray-600)">${err.message}</p>
        <button onclick="renderLogin()" class="btn btn-primary btn-sm" style="margin-top:1.5rem">Try Again</button>
      </div>
    `;
  }
}

async function submitAnswer(id) {
  const answerText = document.getElementById(`answerText-${id}`).value;
  const answerTag = document.getElementById(`answerTag-${id}`).value;
  const answerBtn = document.getElementById(`answerBtn-${id}`);

  if (!answerText.trim()) {
    alert('Please enter an answer before posting.');
    return;
  }

  answerBtn.disabled = true;
  answerBtn.innerText = 'Posting...';

  try {
    const res = await fetch('/api/admin/answer', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        id,
        answer: answerText,
        tag: answerTag,
        secret: adminSecret
      })
    });

    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || 'Failed to submit answer.');
    }

    renderDashboard();
  } catch (err) {
    answerBtn.disabled = false;
    answerBtn.innerText = 'Post Answer';
    alert(err.message);
  }
}

async function updateQuestionTag(id) {
  const q = allQuestions.find(item => item.id === id);
  if (!q) return;

  const newTag = document.getElementById(`editTag-${id}`).value;
  const statusEl = document.getElementById(`updateStatus-${id}`);
  const selectEl = document.getElementById(`editTag-${id}`);

  selectEl.disabled = true;
  statusEl.style.color = 'var(--gray-500)';
  statusEl.textContent = 'Updating...';
  statusEl.style.display = 'inline';

  try {
    const res = await fetch('/api/admin/answer', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        id,
        answer: q.answer,
        tag: newTag,
        secret: adminSecret
      })
    });

    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || 'Failed to update category.');
    }

    statusEl.style.color = '#166534';
    statusEl.textContent = '✓ Saved';
    q.tag = newTag;

    setTimeout(() => {
      statusEl.style.display = 'none';
      renderDashboard();
    }, 800);
  } catch (err) {
    statusEl.style.color = '#dc2626';
    statusEl.textContent = '✗ Error';
    alert(err.message);
  } finally {
    selectEl.disabled = false;
  }
}

function logoutAdmin() {
  sessionStorage.removeItem('admin_secret');
  adminSecret = '';
  renderLogin();
}

function renderUtmParams(utm_params) {
  if (!utm_params) return '';
  const keys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
  const parts = [];
  keys.forEach(k => {
    if (utm_params[k]) {
      parts.push(`<strong>${k.replace('utm_', '')}:</strong> <code style="background:#f3f4f6; padding:0.1rem 0.35rem; border-radius:4px; font-size:11px; border:1px solid #e5e7eb; font-family:monospace; color:#1a4cc8;">${utm_params[k]}</code>`);
    }
  });
  if (parts.length === 0) return '';
  return `
    <div style="font-size:11px; color:var(--gray-600); display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;">
      <span style="font-weight:500;">🎯 UTMs:</span>
      ${parts.join(' ')}
    </div>
  `;
}

function renderTrackingDetails(q) {
  const parts = [];
  if (q.ip) {
    parts.push(`<strong>IP:</strong> <code style="background:#f3f4f6; padding:0.1rem 0.35rem; border-radius:4px; font-size:11px; border:1px solid #e5e7eb; font-family:monospace; color:#4b5563;">${q.ip}</code>`);
  }
  if (q.referrer && q.referrer !== 'Direct') {
    const escapedRef = q.referrer.replace(/"/g, '&quot;');
    parts.push(`<strong>Referrer:</strong> <a href="${escapedRef}" target="_blank" style="font-size:11px; color:var(--blue); text-decoration:underline; word-break:break-all;">${q.referrer}</a>`);
  } else {
    parts.push(`<strong>Referrer:</strong> <span style="font-size:11px; color:var(--gray-500);">Direct</span>`);
  }
  if (q.li_fat_id) {
    parts.push(`<strong>li_fat_id:</strong> <code style="background:#f3f4f6; padding:0.1rem 0.35rem; border-radius:4px; font-size:11px; border:1px solid #e5e7eb; font-family:monospace; color:#166534; font-weight:600;">${q.li_fat_id}</code>`);
  }

  const utmHtml = renderUtmParams(q.utm_params);
  
  if (!utmHtml && parts.length === 0) return '';

  return `
    <div style="margin-top:0.5rem; display:flex; flex-direction:column; gap:0.4rem; border-top:1px dashed #e5e7eb; padding-top:0.5rem; width: 100%;">
      ${utmHtml}
      <div style="font-size:11px; color:var(--gray-600); display:flex; flex-wrap:wrap; gap:0.5rem 1rem; align-items:center;">
        <span>ℹ️ Session:</span>
        ${parts.join(' | ')}
      </div>
    </div>
  `;
}

function downloadQuestionsCSV() {
  if (!allQuestions || allQuestions.length === 0) {
    alert("No questions available to download.");
    return;
  }

  const csvRows = [];
  // Define headers
  const headers = ["ID", "Username", "Email", "Category", "Status", "Created At", "Question", "Answer", "IP Address", "Referrer", "li_fat_id", "UTM Source", "UTM Medium", "UTM Campaign", "UTM Term", "UTM Content"];
  csvRows.push(headers.map(h => `"${h.replace(/"/g, '""')}"`).join(","));

  for (const q of allQuestions) {
    const utm = q.utm_params || {};
    const row = [
      q.id || "",
      q.username || "",
      q.email || "",
      q.tag || "General",
      q.status || "",
      q.created_at || "",
      q.question || "",
      q.answer || "",
      q.ip || "Unknown",
      q.referrer || "Direct",
      q.li_fat_id || "",
      utm.utm_source || "",
      utm.utm_medium || "",
      utm.utm_campaign || "",
      utm.utm_term || "",
      utm.utm_content || ""
    ];

    const escapedRow = row.map(val => {
      const stringVal = String(val).replace(/\r?\n/g, " ").replace(/"/g, '""');
      return `"${stringVal}"`;
    });
    csvRows.push(escapedRow.join(","));
  }

  const csvString = csvRows.join("\r\n");
  const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  link.setAttribute("href", url);
  link.setAttribute("download", `peaceful_loans_questions_${new Date().toISOString().slice(0,10)}.csv`);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

window.onload = showPage;
</script>
</body>
</html>
